name: Ruff Linting check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install uv
        run: pip install uv

      - name: Create virtual environment
        run: uv venv

      - name: Sync dependencies from uv.lock
        run: uv sync --dev

      - name: Run Ruff
        run: uv run ruff check src
